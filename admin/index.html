<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="/style.css"></head><body><div id="login" class="c" style="max-width:430px;padding-top:10vh"><div class="card pad form"><img class="logo" src="/images/logo.png"><h1>Admin Girişi</h1><input id="pass" type="password" placeholder="Şifre"><button class="btn primary" onclick="go()">Giriş</button></div></div><div id="panel" hidden><header><div class="c nav"><img class="logo" src="/images/logo.png"><a class="btn" href="/">Siteyi Gör</a></div></header><div class="c admin"><aside class="card pad"><button class="btn" onclick="tab('products')">Ürünler</button><button class="btn primary" onclick="tab('reviews')">Yorumlar</button><button class="btn" onclick="tab('settings')">Ayarlar</button><button class="btn" onclick="save()">Buluta Kaydet</button><p id="msg"></p></aside><main><section id="productsTab" hidden><h1>Ürünler</h1><button class="btn primary" onclick="addProduct()">+ Ürün Ekle</button><div id="productList"></div></section><section id="reviewsTab"><h1>Google + Yandex Yorum Akışı</h1><p class="muted">Yalnızca işletme sayfalarınızda gerçekten yayımlanmış yorumları ekleyin.</p><button class="btn primary" onclick="addReview()">+ Yorum Ekle</button><div id="reviewList"></div></section><section id="settingsTab" hidden><h1>Ayarlar</h1><div id="settingsBox" class="card pad form"></div></section></main></div></div><script src="/app.js"></script><script>let password='';async function go(){password=pass.value;await load();login.hidden=true;panel.hidden=false;render()}function tab(x){productsTab.hidden=x!=='products';reviewsTab.hidden=x!=='reviews';settingsTab.hidden=x!=='settings'}function render(){productList.innerHTML=data.products.map((p,i)=>`<div class="card edit fields"><label>Ad<input value="${esc(p.name)}" oninput="data.products[${i}].name=this.value"></label><label>Fiyat<input value="${esc(p.price)}" oninput="data.products[${i}].price=this.value"></label><label>Görsel<input value="${esc(p.image)}" oninput="data.products[${i}].image=this.value"></label><label>Açıklama<textarea oninput="data.products[${i}].description=this.value">${esc(p.description)}</textarea></label><button class="btn" onclick="data.products.splice(${i},1);render()">Sil</button></div>`).join('');reviewList.innerHTML=data.reviews.map((r,i)=>`<div class="card edit fields"><label>Kaynak<select onchange="data.reviews[${i}].source=this.value"><option ${r.source==='Google'?'selected':''}>Google</option><option ${r.source==='Yandex'?'selected':''}>Yandex</option></select></label><label>Müşteri adı<input value="${esc(r.name)}" oninput="data.reviews[${i}].name=this.value"></label><label>Puan<input type="number" min="1" max="5" value="${r.rating}" oninput="data.reviews[${i}].rating=this.value"></label><label>Yorum<textarea oninput="data.reviews[${i}].text=this.value">${esc(r.text)}</textarea></label><button class="btn" onclick="data.reviews.splice(${i},1);render()">Sil</button></div>`).join('');settingsBox.innerHTML=Object.keys(data.settings).map(k=>`<label>${k}<textarea oninput="data.settings['${k}']=this.value">${esc(data.settings[k])}</textarea></label>`).join('')}function addProduct(){data.products.push({id:Date.now()+'',name:'Yeni Ürün',price:'0 TL',category:'Taze Buketler',description:'Açıklama',image:'',active:true});render()}function addReview(){data.reviews.push({id:Date.now()+'',source:'Google',name:'',rating:5,text:''});render()}async function save(){msg.textContent='Kaydediliyor';const r=await fetch('/api/data',{method:'POST',headers:{'content-type':'application/json','x-admin-password':password},body:JSON.stringify(data)});const x=await r.json();msg.textContent=r.ok?'Tüm cihazlar için kaydedildi':x.error}</script></body></html>
