<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nur Çiçek Admin</title><link rel="stylesheet" href="/style.css"></head><body class="adminShell"><div id="login" class="c" style="max-width:430px;padding-top:9vh"><div class="card adminCard form"><img class="logo" src="/images/logo.png"><h1>Yönetim Paneli</h1><input id="pass" type="password" placeholder="Admin şifresi"><button class="btn primary" onclick="go()">Giriş Yap</button></div></div><div id="panel" hidden><header class="adminTop"><div class="c nav"><img class="logo" src="/images/logo.png"><a class="btn" href="/">👁 Siteyi Gör</a></div></header><div class="c admin"><aside class="sidebar"><img class="logo" src="/images/logo.png"><button class="sidebtn active" onclick="tab('products',this)">▣ Ürün Yönetimi</button><button class="sidebtn" onclick="tab('reviews',this)">◯ Yorumlar</button><button class="sidebtn" onclick="tab('settings',this)">⚙ Site Ayarları</button><button class="sidebtn" onclick="save()">☁ Buluta Kaydet</button><p id="msg"></p></aside><main class="adminMain"><section id="productsTab"><div class="sectionHead"><div><h1>Ürün Yönetimi</h1><p class="muted">Ürün, fiyat, kategori ve görselleri yönetin.</p></div><button class="btn primary" onclick="addProduct()">+ Yeni Ürün Ekle</button></div><div id="productList"></div></section><section id="reviewsTab" hidden><div class="sectionHead"><div><h1>Yorum Yönetimi</h1><p class="muted">Gerçek Google ve Yandex yorumlarını kayan alana ekleyin.</p></div><button class="btn primary" onclick="addReview()">+ Yorum Ekle</button></div><div id="reviewList"></div></section><section id="settingsTab" hidden><h1>Site Ayarları</h1><div id="settingsBox" class="card adminCard form"></div></section></main></div></div><script src="/app.js"></script><script>let password='';async function go(){password=pass.value;await load();login.hidden=true;panel.hidden=false;render()}function tab(x,b){productsTab.hidden=x!=='products';reviewsTab.hidden=x!=='reviews';settingsTab.hidden=x!=='settings';document.querySelectorAll('.sidebtn').forEach(e=>e.classList.remove('active'));b.classList.add('active')}function render(){productList.innerHTML=data.products.map((p,i)=>`<div class="card adminCard editGrid"><img class="thumb" src="${esc(p.image)}"><div class="fields"><label>Ürün adı<input value="${esc(p.name)}" oninput="data.products[${i}].name=this.value"></label><label>Fiyat<input value="${esc(p.price)}" oninput="data.products[${i}].price=this.value"></label><label>Kategori<input value="${esc(p.category)}" oninput="data.products[${i}].category=this.value"></label><label>Görsel URL<input value="${esc(p.image)}" oninput="data.products[${i}].image=this.value"></label><label>Açıklama<textarea oninput="data.products[${i}].description=this.value">${esc(p.description)}</textarea></label><label>Durum<select onchange="data.products[${i}].active=this.value==='Yayında'"><option ${p.active?'selected':''}>Yayında</option><option ${!p.active?'selected':''}>Gizli</option></select></label><button class="btn" onclick="data.products.splice(${i},1);render()">Sil</button></div></div>`).join('');reviewList.innerHTML=data.reviews.map((r,i)=>`<div class="card adminCard fields"><label>Kaynak<select onchange="data.reviews[${i}].source=this.value"><option ${r.source==='Google'?'selected':''}>Google</option><option ${r.source==='Yandex'?'selected':''}>Yandex</option></select></label><label>Müşteri adı<input value="${esc(r.name)}" oninput="data.reviews[${i}].name=this.value"></label><label>Puan<input type="number" min="1" max="5" value="${r.rating}" oninput="data.reviews[${i}].rating=this.value"></label><label>Yorum<textarea oninput="data.reviews[${i}].text=this.value">${esc(r.text)}</textarea></label><button class="btn" onclick="data.reviews.splice(${i},1);render()">Sil</button></div>`).join('');settingsBox.innerHTML=Object.keys(data.settings).map(k=>`<label>${k}<textarea oninput="data.settings['${k}']=this.value">${esc(data.settings[k])}</textarea></label>`).join('')}function addProduct(){data.products.push({id:Date.now()+'',name:'Yeni Ürün',price:'0 TL',category:'Taze Buketler',description:'Ürün açıklaması',image:'',active:true});render()}function addReview(){data.reviews.push({id:Date.now()+'',source:'Google',name:'',rating:5,text:''});render()}async function save(){msg.textContent='Kaydediliyor...';const r=await fetch('/api/data',{method:'POST',headers:{'content-type':'application/json','x-admin-password':password},body:JSON.stringify(data)});const x=await r.json();msg.textContent=r.ok?'Tüm cihazlar için kaydedildi':x.error}</script></body></html>
