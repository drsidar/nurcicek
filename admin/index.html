<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="/style.css"></head><body><div id="login" class="c" style="max-width:430px;padding-top:12vh"><div class="card pad form"><img class="logo" src="/images/logo.png" alt="Logo"><h1>Admin Girişi</h1><input id="pass" type="password" placeholder="Şifre"><button class="btn primary" onclick="go()">Giriş</button></div></div><div id="panel" hidden><header><div class="c nav"><img class="logo" src="/images/logo.png" alt="Logo"><a class="btn" href="/">Siteyi Gör</a></div></header><div class="c admin"><aside class="card pad"><button class="btn primary" onclick="tab('products')">Ürünler</button><button class="btn" onclick="tab('reviews')">Yorumlar</button><button class="btn" onclick="tab('settings')">Ayarlar</button><button class="btn" onclick="save()">Buluta Kaydet</button><p id="msg"></p></aside><main><section id="productsTab"><h1>Ürün Yönetimi</h1><button class="btn primary" onclick="add()">+ Ürün Ekle</button><div id="list" style="margin-top:18px"></div></section><section id="reviewsTab" hidden><h1>Yorum Yönetimi</h1><button class="btn primary" onclick="addReview()">+ Yorum Ekle</button><div id="reviewList" style="margin-top:18px"></div></section><section id="settingsTab" hidden><h1>Site Ayarları</h1><div id="settings" class="card pad form"></div></section></main></div></div><script src="/app.js"></script><script>let password='';async function go(){password=pass.value;try{await load();login.hidden=true;panel.hidden=false;render()}catch(e){alert(e.message)}}function tab(x){productsTab.hidden=x!=='products';reviewsTab.hidden=x!=='reviews';settingsTab.hidden=x!=='settings'}function render(){list.innerHTML=data.products.map((p,i)=>`<div class="card edit"><img src="${esc(p.image)}"><div class="fields"><label>Ad<input value="${esc(p.name)}" oninput="data.products[${i}].name=this.value"></label><label>Fiyat<input value="${esc(p.price)}" oninput="data.products[${i}].price=this.value"></label><label>Kategori<input value="${esc(p.category)}" oninput="data.products[${i}].category=this.value"></label><label>Görsel URL<input value="${esc(p.image)}" oninput="data.products[${i}].image=this.value"></label><label>Açıklama<textarea oninput="data.products[${i}].description=this.value">${esc(p.description)}</textarea></label><label>Yayında <input type="checkbox" ${p.active?'checked':''} onchange="data.products[${i}].active=this.checked"></label><button class="btn" onclick="del(${i})">Sil</button></div></div>`).join('');settings.innerHTML=Object.keys(data.settings).map(k=>`<label>${k}<textarea oninput="data.settings['${k}']=this.value">${esc(data.settings[k])}</textarea></label>`).join('');renderReviews()}function add(){data.products.push({id:Date.now()+'',name:'Yeni Ürün',price:'0 TL',category:'Taze Buketler',description:'Açıklama',image:'https://images.unsplash.com/photo-1497250681960-ef046c08a56e?auto=format&fit=crop&w=1200&q=80',active:true});render()}function del(i){data.products.splice(i,1);render()}function renderReviews(){if(!data.reviews)data.reviews=[];reviewList.innerHTML=data.reviews.map((r,i)=>`<div class="card pad" style="margin-bottom:14px"><div class="fields"><label>Müşteri Adı<input value="${esc(r.name)}" oninput="data.reviews[${i}].name=this.value"></label><label>Puan (1-5)<input type="number" min="1" max="5" value="${r.rating}" oninput="data.reviews[${i}].rating=Math.max(1,Math.min(5,parseInt(this.value)||5))"></label><label>Kaynak<select onchange="data.reviews[${i}].source=this.value"><option value="google" ${r.source==='google'?'selected':''}>Google</option><option value="yandex" ${r.source==='yandex'?'selected':''}>Yandex</option></select></label><label>Yayında <input type="checkbox" ${r.active?'checked':''} onchange="data.reviews[${i}].active=this.checked"></label></div><label>Yorum Metni<textarea oninput="data.reviews[${i}].text=this.value">${esc(r.text)}</textarea></label><button class="btn" onclick="delReview(${i})">Sil</button></div>`).join('')}function addReview(){if(!data.reviews)data.reviews=[];data.reviews.push({id:Date.now()+'',name:'Müşteri Adı',rating:5,text:'Yorum metni',source:'google',active:true});renderReviews()}function delReview(i){data.reviews.splice(i,1);renderReviews()}async function save(){msg.textContent='Kaydediliyor';const r=await fetch('/api/data',{method:'POST',headers:{'content-type':'application/json','x-admin-password':password},body:JSON.stringify(data)});const x=await r.json();msg.textContent=r.ok?'Tüm cihazlar için kaydedildi':x.error}</script></body></html>
